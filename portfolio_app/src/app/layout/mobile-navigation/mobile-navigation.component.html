@if (open()) {
  <nav id="mobile-navigation-panel" class="mobile-nav" aria-label="Mobile primary navigation">
    <ul>
      @for (link of links(); track link.path) {
        <li>
          @if (link.implemented) {
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="close()"
            >
              {{ link.label }}
            </a>
          } @else {
            <span class="pending" aria-disabled="true">{{ link.label }}</span>
          }
        </li>
      }
    </ul>
  </nav>
}
